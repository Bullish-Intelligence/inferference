# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# Inferference — a Python devenv repo.
#
# This file is committed in the pinned shape: every first-party input names a
# published tag, so a fresh clone and CI both evaluate it with no sibling
# checkouts. `git+https://` and not the `github:` shorthand: some of these
# repos can be private, and only the git fetcher uses your git credential helper.
# Personal tool modules come from a machine-local overlay.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

nixpkgs:
  permitted_unfree_packages:
    - cuda_nvcc
    - cuda_compat
    - cuda_cudart
    - cuda_cccl
    - libcublas
    - cuda_nvrtc
